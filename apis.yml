    description: >-
      The Lumen Developer Center publishes Lumen's enterprise API catalog,
      including Location, Quoting, Ordering, Service Inventory, Billing,
      Outbound Notification, and Trouble Ticket APIs. All APIs use OAuth 2.0
      Client Credentials against api.lumen.com and require registration for
      API access plus administrator enablement of the API products an API key
      covers. Base URL confirmed by live probe on 2026-09-05: the token
      endpoints https://api.lumen.com/oauth/v1/token and /oauth/v2/token both
      answer with real OAuth errors. The v2 gateway identifies itself as
      Apigee. The former /apis index at developer.lumen.com now 302s to the
      site root; the shipped SPA route table declares only /devcenter/home,
      /devcenter/getting-started, /devcenter/support, /devcenter/overview and
      /devcenter/docs/:category/:section?/:slug?.
  - aid: centurylink:lumen-api-marketplace
    name: Lumen API Marketplace
    tags:
      - API Marketplace
      - Enterprise
      - Partners
    tags_raw:
      - API Marketplace
      - Enterprise
      - Partner
    humanURL: https://developer.lumen.com/
    properties:
      - url: https://developer.lumen.com/
        type: Website
      - url: https://docs.lumen.com/lumen-connect/apis/
        type: APIKeys
    description: >-
      The Lumen API Marketplace was the enterprise catalog where partners and
      customers browsed APIs and requested credentials. It has been folded
      into the Lumen Developer Center and Lumen Connect. As of 2026-09-05 the
      apimarketplace.lumen.com host still answers, but it presents a TLS
      certificate for CN=developer.centurylink.com that expired 2026-01-15,
      so an ordinary browser refuses the connection before its 301 to
      developer.lumen.com is ever followed. Its two former pointers have been
      removed from this record and the finding is captured in
      lifecycle/centurylink-lifecycle.yml. API key creation, editing, product
      scoping and client-secret reset now live in Lumen Connect and are
      documented on docs.lumen.com.
  - aid: centurylink:lumen-openapi-services
    name: Lumen OpenAPI Services (Level 3 legacy)
    tags:
      - Connectivity
      - Level 3
      - Location
      - OpenAPI
    humanURL: https://docs.lumen.com/lumen-connect/apis/
    properties:
      - url: https://docs.lumen.com/lumen-connect/apis/
        type: Documentation
    description: >-
      The Level 3 / Lumen OpenAPI Services portal provided OpenAPI-described
      REST services such as the Lumen Location API. The portal is GONE:
      developer.level3.com no longer resolves in DNS (probed 2026-09-05), so
      both of this entry's former pointers were dead and have been removed.
      The surviving public documentation for API access to the successor
      products is the Lumen Connect APIs section on docs.lumen.com. No
      OpenAPI document from this family is published at any reachable URL.
  - aid: centurylink:lumen-public-sector-api-center
    name: Lumen Public Sector API Center
    tags:
      - Federal
      - Government
      - Public Sector
      - State and Local
    humanURL: https://www.lumen.com/en-us/public-sector.html
    properties:
      - url: https://www.lumen.com/en-us/public-sector.html
        type: Solutions
    description: >-
      The Public Sector API Center offers government-tailored REST APIs for
      Lumen network services, enabling federal, state, and local agencies to
      programmatically order, provision, and monitor connectivity and managed
      services. Both pointers previously carried here were dead as of
      2026-09-05 — blog.centurylink.com no longer resolves in DNS and
      /en-us/solutions/public-sector.html returns 404 — and have been
      replaced with the live public-sector section.
  - aid: centurylink:quantum-fiber
    name: Quantum Fiber Residential Services
    tags:
      - Broadband
      - Fiber
      - Residential
    humanURL: https://www.quantumfiber.com/
    properties:
      - url: https://www.quantumfiber.com/
        type: Website
      - url: https://www.centurylink.com/
        type: LegacyBrand
    description: >-
      Quantum Fiber is Lumen's residential multi-gigabit fiber brand that
      supersedes CenturyLink in markets with fiber deployment, with account
      and service management exposed through consumer web and mobile apps
      rather than a public developer API.
