description: >-
  CenturyLink is the residential broadband and home services brand of Lumen
  Technologies, a Fortune 500 telecommunications provider operating one of
  the largest fiber networks in North America. Following the Level 3
  acquisition and rebrand to Lumen, CenturyLink's developer surface is
  exposed through the Lumen Developer Center, which publishes REST APIs
  secured by OAuth 2.0 for enterprise location qualification, quote-to-order,
  provisioning, billing, notifications, CDN and edge compute, DDoS
  mitigation, and Public Sector networking products. The production API
  gateway answers at api.lumen.com, but no OpenAPI, AsyncAPI or GraphQL
  contract is published anonymously: the Developer Center is a
  module-federation single-page app that returns the same HTML shell for
  every path and loads its specifications from a sign-in-gated service.
