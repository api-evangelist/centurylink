  against developer.lumen.com is the SPA catch-all shell (an identical 11,800-byte
  text/html Vue module-federation bootstrap returned for EVERY path on that host,
  including to Googlebot) and is therefore a MISS, not a document. No WellKnown or
  SecurityTxt pointer is emitted in apis.yml because nothing real was served.
